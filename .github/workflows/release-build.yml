name: Release
'on':
  workflow_dispatch: null
  push:
    tags:
      - 'v*'
concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest
          - ubuntu-22.04
    runs-on: '${{ matrix.platform }}'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rust setup (mac)
        if: 'startsWith(matrix.platform, ''macos'')'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: 'rustfmt, clippy'
          targets: 'aarch64-apple-darwin, x86_64-apple-darwin'
      - name: Rust setup
        if: '!startsWith(matrix.platform, ''macos'')'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: 'rustfmt, clippy'
      - name: Setup rust cache
        uses: actions/cache@v4
        with:
          path: target/**
          key: '${{ runner.os }}-rust-target-${{ hashFiles(''**/Cargo.lock'') }}'
          restore-keys: |
            ${{ runner.os }}-rust-target-
      - name: Remove bundles restored from cache
        shell: bash
        run: rm -rf target/release/bundle target/*/release/bundle
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: '${{ steps.pnpm-cache.outputs.STORE_PATH }}'
          key: '${{ runner.os }}-pnpm-store-${{ hashFiles(''**/pnpm-lock.yaml'') }}'
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: install dependencies (ubuntu only)
        if: 'startsWith(matrix.platform, ''ubuntu'')'
        run: >
          sudo apt-get update

          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl
          wget file libxdo-dev libssl-dev pkg-config
          libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: |
          cd apps/app
          pnpm install
      - name: Configure app environment
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env
      - name: build app (macos)
        run: >-
          pnpm --filter=@modrinth/app run tauri build --target
          universal-apple-darwin --config "tauri-release.conf.json"
        if: 'startsWith(matrix.platform, ''macos'')'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          TAURI_SIGNING_PRIVATE_KEY: '${{ secrets.TAURI_PRIVATE_KEY }}'
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: '${{ secrets.TAURI_KEY_PASSWORD }}'
      - name: build app
        run: >-
          pnpm --filter=@modrinth/app run tauri build --config
          "tauri-release.conf.json"
        id: build_os
        if: '!startsWith(matrix.platform, ''macos'')'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          TAURI_SIGNING_PRIVATE_KEY: '${{ secrets.TAURI_PRIVATE_KEY }}'
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: '${{ secrets.TAURI_KEY_PASSWORD }}'
      - name: 'upload ${{ matrix.platform }}'
        uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.platform }}'
          path: |
            target/*/release/bundle/*/*.dmg
            target/*/release/bundle/*/*.app.tar.gz
            target/*/release/bundle/*/*.app.tar.gz.sig
            target/release/bundle/*/*.dmg
            target/release/bundle/*/*.app.tar.gz
            target/release/bundle/*/*.app.tar.gz.sig

            target/release/bundle/*/*.AppImage
            target/release/bundle/*/*.AppImage.tar.gz
            target/release/bundle/*/*.AppImage.tar.gz.sig
            target/release/bundle/*/*.deb
            target/release/bundle/*/*.rpm

            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.nsis.zip.sig

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten files and generate update manifest
        id: generate_manifest
        shell: bash
        run: |
          mkdir -p dist

          # Find and move all build artifacts flatly into dist/
          find artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o \
            -name "*.app.tar.gz.sig" -o \
            -name "*.AppImage" -o \
            -name "*.AppImage.tar.gz" -o \
            -name "*.AppImage.tar.gz.sig" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.exe" -o \
            -name "*.nsis.zip" -o \
            -name "*.nsis.zip.sig" \
          \) -exec cp {} dist/ \;

          echo "Contents of dist:"
          ls -la dist/

          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          DOWNLOAD_URL_BASE="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}"

          # Helper function to find a file matching pattern in dist/
          find_file() {
            find dist -maxdepth 1 -type f -name "$1" | head -n 1
          }

          # Read signature files dynamically
          DARWIN_SIG_FILE=$(find_file "*.app.tar.gz.sig")
          LINUX_SIG_FILE=$(find_file "*.AppImage.tar.gz.sig")
          WINDOWS_SIG_FILE=$(find_file "*.nsis.zip.sig")

          DARWIN_SIGNATURE=""
          [ -f "$DARWIN_SIG_FILE" ] && DARWIN_SIGNATURE=$(cat "$DARWIN_SIG_FILE")

          LINUX_SIGNATURE=""
          [ -f "$LINUX_SIG_FILE" ] && LINUX_SIGNATURE=$(cat "$LINUX_SIG_FILE")

          WINDOWS_SIGNATURE=""
          [ -f "$WINDOWS_SIG_FILE" ] && WINDOWS_SIGNATURE=$(cat "$WINDOWS_SIG_FILE")

          DARWIN_TAR=$(basename $(find_file "*.app.tar.gz") 2>/dev/null || echo "")
          DARWIN_DMG=$(basename $(find_file "*.dmg") 2>/dev/null || echo "")

          LINUX_TAR=$(basename $(find_file "*.AppImage.tar.gz") 2>/dev/null || echo "")
          LINUX_APPIMAGE=$(basename $(find_file "*.AppImage") 2>/dev/null || echo "")
          LINUX_DEB=$(basename $(find_file "*.deb") 2>/dev/null || echo "")
          LINUX_RPM=$(basename $(find_file "*.rpm") 2>/dev/null || echo "")

          WINDOWS_ZIP=$(basename $(find_file "*.nsis.zip") 2>/dev/null || echo "")
          WINDOWS_EXE=$(basename $(find_file "*.exe") 2>/dev/null || echo "")

          cat > dist/update-manifest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${TAG_NAME}",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-x86_64": {
                "signature": "${DARWIN_SIGNATURE}",
                "url": "${DOWNLOAD_URL_BASE}/${DARWIN_TAR}",
                "install_urls": [
                  "${DOWNLOAD_URL_BASE}/${DARWIN_DMG}"
                ]
              },
              "darwin-aarch64": {
                "signature": "${DARWIN_SIGNATURE}",
                "url": "${DOWNLOAD_URL_BASE}/${DARWIN_TAR}",
                "install_urls": [
                  "${DOWNLOAD_URL_BASE}/${DARWIN_TAR}"
                ]
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIGNATURE}",
                "url": "${DOWNLOAD_URL_BASE}/${LINUX_TAR}",
                "install_urls": [
                  "${DOWNLOAD_URL_BASE}/${LINUX_DEB}",
                  "${DOWNLOAD_URL_BASE}/${LINUX_APPIMAGE}",
                  "${DOWNLOAD_URL_BASE}/${LINUX_RPM}"
                ]
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIGNATURE}",
                "url": "${DOWNLOAD_URL_BASE}/${WINDOWS_ZIP}",
                "install_urls": [
                  "${DOWNLOAD_URL_BASE}/${WINDOWS_EXE}"
                ]
              }
            }
          }
          EOF

          cp dist/update-manifest.json dist/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

